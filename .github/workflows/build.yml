name: Build and Deploy WebGL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install dependencies
      run: |
        npm install -g http-server
    
    - name: Validate project structure
      run: |
        echo "Checking project files..."
        ls -la
        test -f index.html && echo "✓ index.html exists" || echo "✗ index.html missing"
        test -f src/js/game.js && echo "✓ game.js exists" || echo "✗ game.js missing"
        test -f src/css/style.css && echo "✓ style.css exists" || echo "✗ style.css missing"
    
    - name: Build artifact
      run: |
        mkdir -p dist
        cp -r index.html src dist/
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: webgl-build
        path: dist/
        retention-days: 30
    
    - name: Create Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        files: dist/**/*
        tag_name: web-build-${{ github.run_number }}
        name: Web Build #${{ github.run_number }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        publish_branch: gh-pages
