name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install dependencies
      run: |
        npm install -g http-server
    
    - name: Validate project structure
      run: |
        echo "Checking project files..."
        ls -la
        test -f index.html && echo "✓ index.html exists" || echo "✗ index.html missing"
        test -f src/js/game.js && echo "✓ game.js exists" || echo "✗ game.js missing"
        test -f src/css/style.css && echo "✓ style.css exists" || echo "✗ style.css missing"
    
    - name: Build artifact
      run: |
        mkdir -p dist
        cp -r index.html src dist/
        echo "Build completed. Contents of dist:"
        ls -la dist/
    
    - name: Setup Pages
      uses: actions/configure-pages@v5
    
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './dist'
    
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
